<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPR CIS SCAN v1 - Analytics Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            font-size: 2rem;
            color: var(--primary-color);
        }

        .back-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary-color);
        }

        .stat-card.success {
            border-left-color: var(--success-color);
        }

        .stat-card.warning {
            border-left-color: var(--warning-color);
        }

        .stat-card.danger {
            border-left-color: var(--danger-color);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-color);
        }

        .stat-change {
            font-size: 0.875rem;
            margin-top: 8px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .chart-card h3 {
            margin-bottom: 20px;
        }

        .chart-placeholder {
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            border-radius: 8px;
            color: var(--text-secondary);
        }

        .table-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .data-table th {
            text-align: left;
            padding: 12px;
            background: var(--bg-color);
            font-weight: 600;
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .data-table tr:hover {
            background: var(--bg-color);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-badge.approved {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.manual_review {
            background: #fef3c7;
            color: #92400e;
        }

        .status-badge.rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .spinner-large {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        .bar {
            background: var(--primary-color);
            height: 24px;
            border-radius: 4px;
            transition: width 0.3s;
        }

        .failure-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--bg-color);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .failure-reason {
            flex: 1;
            font-size: 0.9rem;
        }

        .failure-stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .failure-count {
            font-weight: 600;
            color: var(--text-color);
        }

        .failure-percentage {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>📊 Analytics Dashboard</h1>
            <a href="/" class="back-link">← Back to Document Upload</a>
        </div>

        <div id="loading" class="loading">
            <div class="spinner-large"></div>
            <p>Loading analytics data...</p>
        </div>

        <div id="dashboard-content" style="display: none;">
            <!-- Summary Statistics -->
            <div class="stats-grid" id="stats-grid">
                <!-- Stats cards will be populated by JavaScript -->
            </div>

            <!-- Charts -->
            <div class="charts-grid">
                <div class="chart-card">
                    <h3>Verification Trend (Last 30 Days)</h3>
                    <div id="timeline-chart" class="chart-placeholder">
                        <canvas id="timeline-canvas"></canvas>
                    </div>
                </div>

                <div class="chart-card">
                    <h3>Status Distribution</h3>
                    <div id="status-chart" class="chart-placeholder">
                        <canvas id="status-canvas"></canvas>
                    </div>
                </div>
            </div>

            <!-- Failure Reasons -->
            <div class="table-card">
                <h3>Top Mismatch Reasons</h3>
                <div id="failure-reasons-list">
                    <!-- Failure reasons will be populated by JavaScript -->
                </div>
            </div>

            <!-- Recent Verifications -->
            <div class="table-card">
                <h3>Recent Verifications</h3>
                <table class="data-table" id="recent-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Business Name</th>
                            <th>ABN</th>
                            <th>Status</th>
                            <th>Trilogy</th>
                            <th>Document</th>
                        </tr>
                    </thead>
                    <tbody id="recent-tbody">
                        <!-- Recent verifications will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/dashboard.js"></script>
</body>
</html>
